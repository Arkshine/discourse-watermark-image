watermark_default_enabled:
  type: bool
  default: false

watermark_profiles:
  type: objects
  default: []
  schema:
    name: profile
    identifier: name
    properties:
      name:
        type: string
        required: true
        validations:
          min_length: 1
      enabled:
        type: boolean
      categories:
        type: categories
      groups:
        type: groups
        resolve_group_membership: true
      tags:
        type: tags
      source:
        type: enum
        choices: [image, qrcode, text]
      image:
        type: upload
      qrcode_text:
        type: string
      qrcode_color:
        type: string
      qrcode_background_color:
        type: string
      qrcode_quiet_zone:
        type: integer
        validations: { min: 0, max: 10 }
      qrcode_error_correction:
        type: enum
        choices: [Low, Medium, Quarter, High]
      qrcode_style_config:
        type: string
      qrcode_halftone_image:
        type: upload
      qrcode_logo_config:
        type: string
      qrcode_logo_image:
        type: upload
      text:
        type: string
      text_style:
        type: string
      position:
        type: enum
        choices:
          [
            top-left,
            top-center,
            top-right,
            center-left,
            center,
            center-right,
            bottom-left,
            bottom-center,
            bottom-right,
          ]
      margin_x:
        type: integer
      margin_y:
        type: integer
      opacity:
        type: integer
        validations: { min: 1, max: 100 }
      size_mode:
        type: enum
        choices: [relative, absolute]
      relative_width:
        type: integer
        validations: { min: 1, max: 100 }
      absolute_scale:
        type: float
        validations: { min: 0.01 }
      max_size:
        type: integer
        validations: { min: 1, max: 100 }
      rotate:
        type: integer
        validations: { min: -360, max: 360 }
      pattern:
        type: enum
        choices: [single, grid, diagonal, random]
      pattern_allow_partial:
        type: boolean
      pattern_max_count:
        type: integer
        validations: { min: 0 }
      pattern_spacing:
        type: integer
      blend_mode:
        type: enum
        choices:
          [
            normal,
            overlay,
            over,
            atop,
            xor,
            plus,
            multiply,
            burn,
            difference,
            soft_light,
            screen,
            hard_light,
            dodge,
            exclusion,
            lighten,
            darken,
          ]

watermark_source:
  type: enum
  default: "image"
  choices:
    - image
    - qrcode
    - text

watermark_image:
  type: upload
  default: ""

watermark_qrcode_text:
  type: string
  default: ""

watermark_qrcode_color:
  type: string
  list_type: color
  default: "#000000"

watermark_qrcode_background_color:
  type: string
  default: "#ffffff"

watermark_qrcode_quiet_zone:
  type: integer
  default: 2
  min: 0
  max: 10

watermark_qrcode_error_correction:
  type: enum
  default: "Medium"
  choices:
    - Low
    - Medium
    - Quarter
    - High

watermark_qrcode_style_config:
  type: string
  default: '{"style":"basic","params":{}}'

watermark_qrcode_halftone_image:
  type: upload
  default: ""

watermark_qrcode_logo_config:
  type: string
  default: '{"enabled":false}'

watermark_qrcode_logo_image:
  type: upload
  default: ""

watermark_text:
  type: string
  default: ""
  textarea: true

watermark_text_style:
  type: string
  default: '{"font":"{\"key\":\"site\"}","weight":"normal","italic":false,"textCase":"none","letterSpacing":"0","align":"center","color":"#ffffff","strokeColor":"#000000","strokeWidth":"4","shadowColor":"#000000","shadowBlur":"0","backgroundEnabled":false,"backgroundColor":"#000000"}'

watermark_position:
  type: enum
  default: "bottom-right"
  choices:
    - top-left
    - top-center
    - top-right
    - center-left
    - center
    - center-right
    - bottom-left
    - bottom-center
    - bottom-right

watermark_margin_x:
  type: integer
  default: 0

watermark_margin_y:
  type: integer
  default: 0

watermark_opacity:
  type: integer
  default: 100
  min: 1
  max: 100

watermark_size_mode:
  type: enum
  default: "relative"
  choices:
    - relative
    - absolute

watermark_relative_width:
  type: integer
  default: 10
  min: 1
  max: 100

watermark_absolute_scale:
  type: float
  default: 1
  min: 0.01

watermark_max_size:
  type: integer
  default: 100
  min: 1
  max: 100

watermark_rotate:
  type: integer
  default: 0
  min: -360
  max: 360

watermark_blend_mode:
  type: enum
  default: "normal"
  choices:
    - normal
    - overlay
    - over
    - atop
    - xor
    - plus
    - multiply
    - burn
    - difference
    - soft_light
    - screen
    - hard_light
    - dodge
    - exclusion
    - lighten
    - darken

watermark_pattern:
  type: enum
  default: "single"
  choices:
    - single
    - grid
    - diagonal
    - random

watermark_pattern_allow_partial:
  type: bool
  default: true

watermark_pattern_max_count:
  type: integer
  default: 50
  min: 0

watermark_pattern_spacing:
  type: integer
  default: 15

watermark_categories:
  type: list
  list_type: category
  default: ""

watermark_groups:
  type: list
  list_type: group
  resolve_group_membership: true
  disallowed_groups: "4"
  default: "5"

watermark_tags:
  type: list
  list_type: tag
  default: ""

watermark_manual_toggle_groups:
  type: list
  list_type: group
  resolve_group_membership: true
  default: ""

watermark_skip_small_images:
  type: bool
  default: false
  description: "Skip watermarking if image is below minimum dimensions"

watermark_min_image_dimensions:
  type: string
  default: "200x200"
  description: "Minimum dimensions required to apply watermark (width x height)"

watermark_allow_non_supported_uploads:
  type: bool
  default: false

watermark_allow_upload_on_error:
  type: bool
  default: true
